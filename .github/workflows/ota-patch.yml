name: OTA build (flutter_patcher)

# flutter_patcher refuses to build or patch on an Intel Mac (macos-x64): it
# publishes patched gen_snapshot binaries for linux-x64, windows-x64 and
# darwin-arm64 only. ubuntu-latest is a verified linux-x64 host, so every host
# build and every patch happens here.
#
# The app is NOT checked out from this repo. It usually lives on a LAN GitLab
# that a GitHub-hosted runner cannot reach, and it depends on local `path:`
# packages. The caller therefore uploads a source snapshot (a release asset)
# that already carries the project's absolute paths; this workflow unpacks it
# back onto those paths, restores the keystore, then builds in place.
#
#   mode=host   -> builds the host APK, keeps its baseline in a release
#   mode=patch  -> restores that baseline from the release, writes the patch
#
# Baselines are namespaced per project: baseline-<profile>-<versionCode>, so
# several apps can share this repo without overwriting each other's baseline.
# The snapshot release (src-cache by default) is scratch space: the asset name
# is reused and clobbered on every build, so it is not a history.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'host = 构建宿主 APK；patch = 基于该宿主产出补丁'
        type: choice
        options: [host, patch]
        default: host
      source_tag:
        description: '源码快照所在的 release 标签'
        required: true
        default: src-cache
      source_asset:
        description: '源码快照文件名（src-<profile>.tar.gz）'
        required: true
      project_path:
        description: '工程在 runner 上的绝对路径（必须与快照内一致）'
        required: true
      profile:
        description: '基线命名空间，不同工程必须不同'
        required: true
      keystore_path:
        description: 'build.gradle 里 storeFile 的绝对路径'
        required: true
      application_id:
        description: '应用的 applicationId（build.gradle 有注释掉的旧 id 时必须显式给）'
        required: false
        default: ''
      flutter_version:
        description: '构建用的 Flutter 版本；flutter_patcher 的工具按版本下载'
        required: false
        default: '3.47.9'
      strategy:
        description: '宿主策略：留空=bytecode（默认）；so=整包 so，不建 kernel/interface'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: ota-${{ inputs.profile }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  host:
    if: inputs.mode == 'host'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h / | tail -1
          # A big Flutter app plus the NDK and two Gradle runs do not fit the
          # default image. Drop toolchains this build never uses. NDK 27 and
          # 28 stay: flutter_patcher's plugin pins 27, the engine needs 28.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6]*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6].* 2>/dev/null || true
          df -h / | tail -1

      - name: Restore the source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_TAG: ${{ inputs.source_tag }}
          SRC_ASSET: ${{ inputs.source_asset }}
          PROJECT: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          # /Users does not exist on a Linux runner. The snapshot restores the
          # project onto the same absolute paths the dev machine uses, which is
          # what makes the `path:` dependencies in pubspec.yaml resolve.
          sudo mkdir -p /Users
          sudo chown "$(id -u):$(id -g)" /Users
          mkdir -p "$RUNNER_TEMP/src"
          gh release download "$SRC_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$SRC_ASSET" -D "$RUNNER_TEMP/src" --clobber
          tar -xzf "$RUNNER_TEMP/src/$SRC_ASSET" -C /
          test -f "$PROJECT/pubspec.yaml"
          cat "$PROJECT/.ci-out/ota-manifest.json" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE: ${{ inputs.keystore_path }}
        run: |
          set -euo pipefail
          # build.gradle names the keystore by the absolute path the project
          # uses on the development machine, so put it there.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the repository secret ANDROID_KEYSTORE_B64 (base64 of Key.store)."
            exit 1
          fi
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"

      - name: Build the host
        env:
          PROJECT: ${{ inputs.project_path }}
          APPLICATION_ID: ${{ inputs.application_id }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          flutter pub get
          # TEMP DIAGNOSTIC: flutter_patcher keeps only the last two lines of a
          # failed step, which hides frontend_server's error text. Widen it.
          f=$(ls -d "$PUB_CACHE"/hosted/pub.dev/flutter_patcher-*/lib/src/cli/core.dart 2>/dev/null | head -1)
          echo "diagnostic patch: $f"
          if [ -n "$f" ]; then sed -i 's/lines.length > 2 ? lines.length - 2 : 0/0/' "$f"; fi
          grep -n "lines.skip" "$f" || true
          # flutter_patcher reads build.gradle without stripping comments, so a
          # commented-out old applicationId looks like a second app; the caller
          # resolved the live one and passes it explicitly.
          extra=""
          if [ -n "$APPLICATION_ID" ]; then extra="--application-id $APPLICATION_ID"; fi
          if [ -n "$STRATEGY" ]; then extra="$extra --strategy $STRATEGY"; fi
          # stdout is the JSON report; warnings go to stderr.
          #
          # Gradle 9 removed jcenter(); some 2021-era plugins (amap_flutter_location
          # 3.0.0, no newer release) still call it and Gradle evaluation dies.
          # flutter_patcher resolves into its own PUB_CACHE under
          # ~/.flutter_patcher, so seed that cache from the project's, already
          # patched; the patcher then reuses it instead of downloading.
          fix_jcenter() {
            local changed=0
            for f in $(grep -rl "jcenter()" "$PUB_CACHE/hosted" ~/.flutter_patcher/pub-cache/hosted 2>/dev/null); do
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              echo "  patched $f"
              changed=$((changed + 1))
            done
            echo "  $changed file(s) patched"
          }
          seed_patcher_cache() {
            local target="$HOME/.flutter_patcher/pub-cache/hosted/pub.dev"
            mkdir -p "$target"
            local n=0
            for f in $(grep -rl "jcenter()" "$PUB_CACHE/hosted" 2>/dev/null); do
              local pkg
              pkg=$(basename "$(dirname "$(dirname "$f")")")
              local src="$PUB_CACHE/hosted/pub.dev/$pkg"
              [ -d "$src" ] || continue
              sed -i 's/jcenter()/mavenCentral()/g' "$src/android/build.gradle" 2>/dev/null || true
              cp -R "$src" "$target/" 2>/dev/null && echo "  seeded $pkg"
              n=$((n + 1))
            done
            echo "  $n package(s) seeded"
          }
          seed_patcher_cache
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            set +e
            dart run flutter_patcher build android $extra \
              > "$RUNNER_TEMP/build.json" 2> "$RUNNER_TEMP/build.err"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then break; fi
            if grep -q "jcenter()" "$RUNNER_TEMP/build.err" && [ "$attempt" -lt 2 ]; then
              echo "jcenter() is gone in Gradle 9; patching the plugin and retrying (attempt $attempt)"
              # A failed run keeps its whole project copy; drop it before
              # building again or the runner runs out of disk.
              rm -rf "$HOME"/.flutter_patcher/builds/* "$PROJECT/build" "$PROJECT/android/.gradle"
              fix_jcenter
              continue
            fi
            break
          done
          echo "exit=$code stdout=$(wc -c < "$RUNNER_TEMP/build.json") bytes stderr=$(wc -c < "$RUNNER_TEMP/build.err") bytes"
          if [ -s "$RUNNER_TEMP/build.err" ]; then
            echo "----- stderr head -----"
            fold -w 300 "$RUNNER_TEMP/build.err" | head -40
            echo "----- stderr tail -----"
            fold -w 300 "$RUNNER_TEMP/build.err" | tail -40
            echo "----- end stderr -----"
          fi
          python3 - "$RUNNER_TEMP/build.json" <<'PY'
          import json, sys, textwrap
          raw = open(sys.argv[1]).read()
          try:
              report = json.loads(raw)
          except Exception as error:
              print('unparsable report:', error)
              print(raw[:4000])
              sys.exit(0)
          print('status:', report.get('status'), report.get('code'))
          for line in str(report.get('message', '')).split(' | '):
              for chunk in textwrap.wrap(line, 300) or ['']:
                  print('  ', chunk)
          PY
          [ "$code" -eq 0 ] || exit "$code"
          python3 - "$RUNNER_TEMP/build.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print('### Host built\n')
          for key in ('app', 'application_id', 'version_code', 'fingerprint', 'signed'):
              if key in report:
                  print(f'- {key}: `{report[key]}`')
          PY

      - name: Diagnose a failed build
        if: failure()
        run: |
          set +e
          echo "----- work dirs -----"
          ls -d ~/.flutter_patcher/builds/*/ 2>/dev/null | tail -3
          work=$(ls -d ~/.flutter_patcher/builds/*/ 2>/dev/null | tail -1)
          [ -z "$work" ] && exit 0
          echo "----- files in $work -----"
          ls "$work" | head -30
          echo "----- interface entries mentioning the class -----"
          for f in "$work"*.yaml "$work"*.json; do
            [ -f "$f" ] || continue
            hit=$(grep -n -A6 "CupertinoDesktopTextSelectionToolbarButton" "$f" 2>/dev/null | head -30)
            [ -n "$hit" ] && { echo "== $f"; echo "$hit"; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: host-apk
          path: ${{ inputs.project_path }}/.dart_tool/flutter_patcher/releases/**/*.apk
          if-no-files-found: error

      - name: Persist the baseline in a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ inputs.project_path }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          code=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version_code'])" "$RUNNER_TEMP/build.json")
          tag="baseline-$PROFILE-$code"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "Baseline $PROFILE versionCode $code" \
              --notes "flutter_patcher host baseline for $PROFILE versionCode $code. Written by ota-patch.yml; every patch of that host needs it, so do not delete."
          gh release upload "$tag" "$PROJECT"/.flutter_patcher/baselines/* \
            -R "$GITHUB_REPOSITORY" --clobber
          {
            echo ""
            echo "基线已存到 release \`$tag\`（不会随 artifact 过期）。"
            echo "下载 host-apk 里的 APK 并安装：\`adb install -r <app-release.apk>\`"
          } >> "$GITHUB_STEP_SUMMARY"

  patch:
    if: inputs.mode == 'patch'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h / | tail -1
          # A big Flutter app plus the NDK and two Gradle runs do not fit the
          # default image. Drop toolchains this build never uses. NDK 27 and
          # 28 stay: flutter_patcher's plugin pins 27, the engine needs 28.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6]*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6].* 2>/dev/null || true
          df -h / | tail -1

      - name: Restore the source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_TAG: ${{ inputs.source_tag }}
          SRC_ASSET: ${{ inputs.source_asset }}
          PROJECT: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          sudo mkdir -p /Users
          sudo chown "$(id -u):$(id -g)" /Users
          mkdir -p "$RUNNER_TEMP/src"
          gh release download "$SRC_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$SRC_ASSET" -D "$RUNNER_TEMP/src" --clobber
          tar -xzf "$RUNNER_TEMP/src/$SRC_ASSET" -C /
          test -f "$PROJECT/pubspec.yaml"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE: ${{ inputs.keystore_path }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the repository secret ANDROID_KEYSTORE_B64 (base64 of Key.store)."
            exit 1
          fi
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"

      - name: Restore the host baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ inputs.project_path }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # patch resolves the baseline by the pubspec build number, so fetch
          # the release that this exact host was built from.
          code=$(python3 -c "import re,sys;print(re.search(r'^version:\s*[^\s+]+\+(\d+)\s*$', open(sys.argv[1]).read(), re.M).group(1))" "$PROJECT/pubspec.yaml")
          tag="baseline-$PROFILE-$code"
          mkdir -p "$PROJECT/.flutter_patcher/baselines"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no release $tag: build that host first (mode=host)."
            exit 1
          fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            -D "$PROJECT/.flutter_patcher/baselines" --clobber
          ls -l "$PROJECT/.flutter_patcher/baselines"

      - name: Make the patch
        env:
          PROJECT: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          flutter pub get
          # Same jcenter() problem as the host build: the plugin Gradle evaluates
          # lives in flutter_patcher's own cache, so seed it, patched.
          fix_jcenter() {
            local changed=0
            for f in $(grep -rl "jcenter()" "$PUB_CACHE/hosted" ~/.flutter_patcher/pub-cache/hosted 2>/dev/null); do
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              echo "  patched $f"
              changed=$((changed + 1))
            done
            echo "  $changed file(s) patched"
          }
          seed_patcher_cache() {
            local target="$HOME/.flutter_patcher/pub-cache/hosted/pub.dev"
            mkdir -p "$target"
            for f in $(grep -rl "jcenter()" "$PUB_CACHE/hosted" 2>/dev/null); do
              local pkg
              pkg=$(basename "$(dirname "$(dirname "$f")")")
              local src="$PUB_CACHE/hosted/pub.dev/$pkg"
              [ -d "$src" ] || continue
              sed -i 's/jcenter()/mavenCentral()/g' "$src/android/build.gradle" 2>/dev/null || true
              cp -R "$src" "$target/" 2>/dev/null && echo "  seeded $pkg"
            done
          }
          seed_patcher_cache
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            set +e
            dart run flutter_patcher patch android > "$RUNNER_TEMP/patch.json" 2> "$RUNNER_TEMP/patch.err"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then break; fi
            if grep -q "jcenter()" "$RUNNER_TEMP/patch.err" && [ "$attempt" -lt 2 ]; then
              echo "jcenter() is gone in Gradle 9; patching the plugin and retrying (attempt $attempt)"
              rm -rf "$HOME"/.flutter_patcher/builds/* "$PROJECT/build" "$PROJECT/android/.gradle"
              fix_jcenter
              continue
            fi
            echo "patch failed (exit $code)"
            fold -w 300 "$RUNNER_TEMP/patch.err" | tail -40
            exit "$code"
          done
          cat "$RUNNER_TEMP/patch.json"
          python3 - "$RUNNER_TEMP/patch.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print('### Patch created\n')
          for key in ('status', 'file', 'fingerprint', 'version'):
              if key in report:
                  print(f'- {key}: `{report[key]}`')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: patch-file
          path: ${{ inputs.project_path }}/.dart_tool/flutter_patcher/patches/**/*.fptc
          if-no-files-found: error
