name: OTA patch (example)

# flutter_patcher refuses to build or patch on an Intel Mac (macos-x64): it
# publishes patched gen_snapshot binaries for linux-x64, windows-x64 and
# darwin-arm64 only. ubuntu-latest is a verified linux-x64 host, so this
# workflow builds the host and makes the patch there instead.
#
#   mode=host   -> builds the host APK, keeps its baseline in a release
#   mode=patch  -> restores that baseline from the release, writes the patch
#
# The baseline lives in the release tagged `baseline-<versionCode>`: artifacts
# expire after 90 days, and `patch` needs the baseline for as long as the host
# is installed. A release keeps it, needs no extra account, and costs no repo
# space. (flutter_patcher's own baseline_store takes file://, s3:// or a
# writable https:// store; this is the same durability, synced by CI.)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'host = 构建宿主 APK；patch = 基于该宿主产出补丁'
        type: choice
        options: [host, patch]
        default: host
      message:
        description: 'mode=patch：可选，留空表示按仓库里提交的代码打补丁'
        required: false
        default: ''
      use_patched_image:
        description: 'mode=patch：同时用 patch_demo_patched.png 覆盖 patch_demo.png'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ota-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    if: inputs.mode == 'host'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # build.gradle names the keystore by the absolute path the project
          # uses on the development machine, so put it there.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the repository secret ANDROID_KEYSTORE_B64 (base64 of Key.store)."
            exit 1
          fi
          sudo mkdir -p /Users/zcj/E
          sudo chown "$(id -u):$(id -g)" /Users/zcj/E
          printf '%s' "$KEYSTORE_B64" | base64 -d > /Users/zcj/E/Key.store
          test -s /Users/zcj/E/Key.store

      - name: Build the host
        working-directory: example
        run: |
          flutter pub get
          # stdout is the JSON report; warnings go to stderr.
          out="$(dart run flutter_patcher build android)"
          echo "$out"
          echo "$out" > "$RUNNER_TEMP/build.json"
          python3 - "$RUNNER_TEMP/build.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print('### Host built\n')
          print(f"- app: `{report['app']}`")
          print(f"- application_id: `{report['application_id']}`")
          print(f"- version_code: `{report['version_code']}`")
          print(f"- fingerprint: `{report['fingerprint']}`")
          print(f"- signed: `{report['signed']}`")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: host-apk
          path: example/.dart_tool/flutter_patcher/releases/**/*.apk
          if-no-files-found: error

      - name: Persist the baseline in a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version_code'])" "$RUNNER_TEMP/build.json")
          tag="baseline-$code"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "Baseline versionCode $code" \
              --notes "flutter_patcher host baseline for versionCode $code. Written by ota-patch.yml; every patch of that host needs it, so do not delete."
          gh release upload "$tag" example/.flutter_patcher/baselines/* \
            -R "$GITHUB_REPOSITORY" --clobber
          {
            echo ""
            echo "基线已存到 release \`$tag\`（不会随 artifact 过期）。"
            echo "下载 host-apk 里的 APK 并安装：\`adb install -r <app-release.apk>\`"
          } >> "$GITHUB_STEP_SUMMARY"

  patch:
    if: inputs.mode == 'patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore the host baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The host this patch is for: patch resolves the baseline by the
          # pubspec build number, so download that host's release.
          code=$(python3 -c "import re,sys;print(re.search(r'^version:\s*[^\s+]+\+(\d+)\s*$', open(sys.argv[1]).read(), re.M).group(1))" example/pubspec.yaml)
          tag="baseline-$code"
          mkdir -p example/.flutter_patcher/baselines
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no release $tag: build that host first (mode=host)."
            exit 1
          fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            -D example/.flutter_patcher/baselines --clobber
          ls -l example/.flutter_patcher/baselines

      - name: Apply the change
        working-directory: example
        env:
          MESSAGE: ${{ inputs.message }}
          SWAP_IMAGE: ${{ inputs.use_patched_image }}
        run: |
          flutter pub get
          python3 - <<'PY'
          import os, pathlib, re, shutil, sys

          # Empty MESSAGE keeps the committed source: the patch then carries
          # exactly what was pushed.
          if not os.environ.get('MESSAGE'):
              print('message unchanged (patch the committed source)')
          else:
              main = pathlib.Path('lib/main.dart')
              text = main.read_text(encoding='utf-8')
              msg = os.environ['MESSAGE'].replace('\\', '\\\\').replace("'", "\\'")
              pattern = r"(const message = ')[^']*(';)"
              new, count = re.subn(pattern, lambda m: m.group(1) + msg + m.group(2), text)
              if count != 1:
                  sys.exit(f'expected one `const message` line, found {count}')
              main.write_text(new, encoding='utf-8')
              print(f'message -> {os.environ["MESSAGE"]}')

          if os.environ.get('SWAP_IMAGE') == 'true':
              shutil.copyfile('assets/patch_demo_patched.png', 'assets/patch_demo.png')
              print('assets/patch_demo.png replaced')
          PY

      - name: Make the patch
        working-directory: example
        run: |
          out="$(dart run flutter_patcher patch android)"
          echo "$out"
          echo "$out" > "$RUNNER_TEMP/patch.json"
          python3 - "$RUNNER_TEMP/patch.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print('### Patch created\n')
          for key in ('status', 'file', 'fingerprint', 'version'):
              if key in report:
                  print(f"- {key}: `{report[key]}`")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: patch-file
          path: example/.dart_tool/flutter_patcher/patches/**/*.fptc
          if-no-files-found: error
