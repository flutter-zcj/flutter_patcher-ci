name: iOS Patcher Incremental Patch

# 生成 flutter_patcher 增量补丁（.fptc）
#
# 状态：结构按实测结论编写（跨机器会 PATCH_NATIVE_CHANGE），但本文件尚未在 CI
# 跑通过一轮（当时 GitHub Actions 被账单拦截）。跑之前先确认 runner 额度。
#
# 必须 macos-15：补丁侧的 native_files 哈希要与宿主构建时一致，
# 只有同一套 Xcode + pod install + SPM 解算能复现。

on:
  workflow_dispatch:
    inputs:
      patch_id:
        description: '补丁标识'
        required: false
        default: 'p11'
        type: string
      diff_path:
        description: '本次改动 diff（相对仓库根目录）'
        required: false
        default: '.github/patches/fix-http-init.diff'
        type: string
      source_tag:
        default: 'src-cache'
        type: string
      source_asset:
        default: 'src-zmoanew.tar.gz'
        type: string
      project_path:
        default: '/Users/zcj/D/work_zbcx/Flutter/code/oa/code/zmoanew'
        type: string
      version_code:
        default: '11'
        type: string
      bundle_id:
        default: 'com.zerogis.zmoa'
        type: string
      profile_name:
        default: 'Builder AdHoc com.zerogis.zmoa'
        type: string
      team_id:
        default: 'AAMF3H7696'
        type: string

permissions:
  contents: write

concurrency:
  group: ios-patcher-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcodebuild -version || true

      - name: Restore source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_TAG: ${{ inputs.source_tag }}
          SRC_ASSET: ${{ inputs.source_asset }}
          PROJECT: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          sudo mkdir -p /Users
          mkdir -p "$RUNNER_TEMP/src"
          for attempt in 1 2 3; do
            if gh release download "$SRC_TAG" -R "$GITHUB_REPOSITORY" \
                 -p "$SRC_ASSET" -D "$RUNNER_TEMP/src" --clobber; then break; fi
            echo "下载失败（$attempt/3）"; sleep 10
          done
          sudo tar -xzf "$RUNNER_TEMP/src/$SRC_ASSET" -C /
          sudo chown -R "$(id -u):$(id -g)" /Users/zcj
          test -f "$PROJECT/pubspec.yaml"

      - name: Apply the change under patch
        env:
          PROJECT: ${{ inputs.project_path }}
          DIFF: ${{ inputs.diff_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          patch -p1 --forward -i "$GITHUB_WORKSPACE/$DIFF"
          grep -n "initHttp" lib/application/application.dart | head -10

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # 与宿主构建完全一致的原生改动：pub get 重生 xcconfig、Podfile/pbxproj 提到 16.0、
      # 锁 AMapLocation、pod install。少了这步必报 PATCH_NATIVE_CHANGE。
      - name: Replay native changes (same as host build)
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          rm -f ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh
          rm -f .flutter-plugins .flutter-plugins-dependencies
          flutter pub get
          python3 - <<'PY'
          import re
          p = "ios/Podfile"; s = open(p).read()
          s = re.sub(r"platform :ios, '[\d.]+'", "platform :ios, '16.0'", s)
          if "pod 'AMapLocation'" not in s:
              s = s.replace("  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))",
                            "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))\n  pod 'AMapLocation', '2.11.0'\n  pod 'AMapFoundation', '1.8.2'")
          open(p, "w").write(s)
          p = "ios/Runner.xcodeproj/project.pbxproj"; s = open(p).read()
          s = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [\d.]+;", "IPHONEOS_DEPLOYMENT_TARGET = 16.0;", s)
          open(p, "w").write(s)
          PY
          python3 "$GITHUB_WORKSPACE/.github/scripts/prepare_ios_signing.py" \
            "${{ inputs.bundle_id }}" "${{ inputs.team_id }}" \
            "${{ inputs.profile_name }}" "$PWD" "${{ inputs.version_code }}"
          cd ios
          for attempt in 1 2 3; do
            if pod install --repo-update; then break; fi
            rm -rf Pods Podfile.lock; sleep 10
            [ "$attempt" -lt 3 ] || exit 1
          done

      - name: Restore flutter_patcher managed environment
        uses: actions/cache/restore@v4
        with:
          path: ~/.flutter_patcher
          key: fp-env-${{ runner.os }}-3.47.9-v3
          restore-keys: |
            fp-env-${{ runner.os }}-3.47.9-

      - name: Warm managed SDK
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          dart run flutter_patcher build ios \
            --application-id "${{ inputs.bundle_id }}" --version-code "${{ inputs.version_code }}" \
            --export-method ad-hoc --out "$GITHUB_WORKSPACE/patcher-warm" > /dev/null 2>&1 || true
          rm -rf "$HOME"/.flutter_patcher/builds/run.pending-* "$GITHUB_WORKSPACE/patcher-warm"
          SDK_DIR=$(find "$HOME/.flutter_patcher/flutter" -maxdepth 1 -mindepth 1 -type d | head -1 || true)
          [ -d "$SDK_DIR/packages/flutter" ] || { echo "::error::managed SDK 未就绪"; exit 1; }
          echo "MANAGED_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Normalize named constructors (same workaround as host build)
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_named_ctors.py" \
            --project "$PWD" --sdk "$MANAGED_SDK" \
            --pub-cache "$HOME/.flutter_patcher/pub-cache" --report "$RUNNER_TEMP/ctors.json"

      - name: Restore baseline (local file store)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ inputs.project_path }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          gh release download ios-patcher-latest -R "$GITHUB_REPOSITORY" \
            -p "ios-baseline-$VERSION_CODE.tar.gz" -D "$RUNNER_TEMP/baseline" --clobber
          mkdir -p "$PROJECT/.flutter_patcher/baselines"
          tar -xzf "$RUNNER_TEMP/baseline/ios-baseline-$VERSION_CODE.tar.gz" \
            -C "$PROJECT/.flutter_patcher/baselines"
          ls -lh "$PROJECT/.flutter_patcher/baselines"


      # 宿主那次成功 build 是在「改名之后」跑的，pbxproj 的 SPM 引用、xcscheme、
      # Package.resolved 都是那次 build 写出来的。补丁侧必须复现同样的后置状态。
      - name: Rebuild native state (no codesign, after normalize)
        if: always()
        continue-on-error: true
        working-directory: ${{ inputs.project_path }}
        run: |
          set +e
          "$MANAGED_SDK/bin/flutter" --suppress-analytics build ios --release             --target lib/main.dart --no-codesign --no-pub 2>&1 | tail -30
          echo "native rebuild exit=$?"

      - name: Compare native files with baseline
        if: always()
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile, json, os, hashlib, re
          proj = os.getcwd()
          bl = os.path.join(proj, ".flutter_patcher/baselines")
          rel = [f for f in os.listdir(bl) if f.startswith("release-")][0]
          with tarfile.open(os.path.join(bl, rel)) as tf:
              receipt = json.load(tf.extractfile("release_receipt.json"))
          app = re.search(r"^name: (\S+)", open("pubspec.yaml").read(), re.M).group(1)
          nf = receipt["package_inputs"][app]["native_files"]
          def sha(fp):
              return hashlib.sha256(open(fp, "rb").read()).hexdigest()
          missing, differ, extra = [], [], []
          for k, v in nf.items():
              fp = os.path.join(proj, k)
              if not os.path.exists(fp): missing.append(k)
              elif sha(fp) != v: differ.append(k)
          skip = ("ios/Pods/", "ios/build/", "ios/.symlinks/")
          excl = {"Generated.xcconfig", "flutter_export_environment.sh",
                  "GeneratedPluginRegistrant.h", "GeneratedPluginRegistrant.m",
                  "ephemeral", "build", ".dart_tool", ".git"}
          for root, dirs, files in os.walk(os.path.join(proj, "ios")):
              dirs[:] = [d for d in dirs if d not in excl]
              for f in files:
                  if f in excl: continue
                  r = os.path.relpath(os.path.join(root, f), proj)
                  if any(r.startswith(x) for x in skip): continue
                  if r not in nf: extra.append(r)
          print("baseline native_files:", len(nf))
          print("缺失:", len(missing)); [print("  -", x) for x in missing[:20]]
          print("内容不同:", len(differ)); [print("  ~", x) for x in differ[:20]]
          print("多出:", len(extra)); [print("  +", x) for x in extra[:20]]
          PY

      - name: Generate patch (.fptc)
        env:
          PROJECT: ${{ inputs.project_path }}
          VERSION_CODE: ${{ inputs.version_code }}
          PATCH_ID: ${{ inputs.patch_id }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/patch-out/$PATCH_ID"      # 必须不存在
          mkdir -p "$(dirname "$OUT")"
          cd "$PROJECT"
          set +e
          dart run flutter_patcher patch ios --version-code "$VERSION_CODE" --out "$OUT" \
            2> "$RUNNER_TEMP/patch.err" | tee "$RUNNER_TEMP/patch.json"
          code=${PIPESTATUS[0]}
          set -e
          if [ -s "$RUNNER_TEMP/patch.err" ]; then
            echo "--- stderr ---"; fold -w 300 "$RUNNER_TEMP/patch.err"
          fi
          if [ "$code" -ne 0 ]; then
            for d in "$HOME"/.flutter_patcher/patches/run.pending-*; do
              [ -d "$d" ] || continue
              echo "== $d =="; find "$d" -maxdepth 2 -type f | head -40
              [ -f "$d/failure.json" ] && tail -120 "$d/failure.json"
            done
            exit "$code"
          fi
          find "$OUT" -maxdepth 2 -type f -exec ls -lh {} \;
          F=$(find "$OUT" -name '*.fptc' | head -1)
          [ -n "$F" ] || { echo "::error::未产出 .fptc"; exit 1; }
          cp "$F" "$GITHUB_WORKSPACE/patch.fptc"
          shasum -a 256 "$GITHUB_WORKSPACE/patch.fptc"
          echo "FPTC=$GITHUB_WORKSPACE/patch.fptc" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-patch-${{ inputs.patch_id }}
          path: patch.fptc
          if-no-files-found: error

      - name: Attach patch to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ inputs.version_code }}
          PATCH_ID: ${{ inputs.patch_id }}
        run: |
          set -euo pipefail
          TAG=ios-patches
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "iOS patches" --notes "iOS 增量补丁"
          cp "$FPTC" "$RUNNER_TEMP/$VERSION_CODE-ios-arm64.fptc"
          gh release upload "$TAG" "$RUNNER_TEMP/$VERSION_CODE-ios-arm64.fptc" -R "$GITHUB_REPOSITORY" --clobber
          cp "$FPTC" "$RUNNER_TEMP/$PATCH_ID.fptc"
          gh release upload "$TAG" "$RUNNER_TEMP/$PATCH_ID.fptc" -R "$GITHUB_REPOSITORY" --clobber

      - name: Save flutter_patcher managed environment
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.flutter_patcher
          key: fp-env-${{ runner.os }}-3.47.9-v3
