name: iOS Patcher Host Build

# 用 flutter_patcher 构建「支持热更新」的 zmoanew Ad Hoc IPA（patcher 宿主）。
#
# 与 ios-adhoc.yml 的区别：那个用标准 `flutter build ios`，原生侧没有 host policy，
# 热更新完全空转；这个用 `dart run flutter_patcher build ios`，会注入 patched engine
# 并在 Info.plist 写入 FlutterPatcherHostTrust，产出的 IPA 才能加载 .fptc 补丁。
#
# 关键约束：
#   1. build ios 只支持 Apple Silicon（macos-15 runner 是 arm64）；
#   2. 签名必须在 build 之前写进 pbxproj（patcher 内部走 `flutter build ipa`）；
#   3. patcher 1.1.1 上游 bug（issue #14）：命名构造函数与实例成员同名会被
#      extract-surface 误判，baseline-kernel 阶段报 Expected instance member。
#      iOS 只能走 bytecode（无 --strategy so），故用 .github/scripts/normalize_named_ctors.py
#      在 runner 副本上统一改名绕过（不动用户本地源码）。

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: '构建标识（用于 IPA 文件名）'
        required: false
        default: 'patcher-v4.2.2'
        type: string
      source_tag:
        description: '源码快照 release tag'
        required: false
        default: 'src-cache'
        type: string
      source_asset:
        description: '源码快照文件名'
        required: false
        default: 'src-zmoanew.tar.gz'
        type: string
      project_path:
        description: '工程绝对路径（快照解包后）'
        required: false
        default: '/Users/zcj/D/work_zbcx/Flutter/code/oa/code/zmoanew'
        type: string
      version_code:
        description: '宿主 build number（非零整数，须与 pubspec +N 一致）'
        required: false
        default: '11'
        type: string
      bundle_id:
        description: '目标 Bundle ID（须与签名 profile 一致）'
        required: false
        default: 'com.zerogis.zmoa'
        type: string

permissions:
  contents: write   # 上传 IPA / 基线到 release

concurrency:
  group: ios-patcher
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 快照保留 /Users/zcj/D/... 绝对路径。macOS runner 的 home 是 /Users/runner，
      # 故需 sudo 建目录并以 root 解包，再把属主改回 runner，Flutter/CocoaPods 才能写。
      - name: Restore source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_TAG: ${{ inputs.source_tag }}
          SRC_ASSET: ${{ inputs.source_asset }}
          PROJECT: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          sudo mkdir -p /Users
          mkdir -p "$RUNNER_TEMP/src"
          for attempt in 1 2 3; do
            if gh release download "$SRC_TAG" -R "$GITHUB_REPOSITORY" \
                 -p "$SRC_ASSET" -D "$RUNNER_TEMP/src" --clobber; then break; fi
            echo "下载失败（$attempt/3），10s 后重试"; sleep 10
          done
          sudo tar -xzf "$RUNNER_TEMP/src/$SRC_ASSET" -C /
          sudo chown -R "$(id -u):$(id -g)" /Users/zcj
          test -f "$PROJECT/pubspec.yaml"
          echo "源码已恢复到 $PROJECT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install CocoaPods deps
        working-directory: ${{ inputs.project_path }}
        run: |
          set -e
          # 快照里的 Generated.xcconfig / .flutter-plugins 带的是开发机旧 FLUTTER_ROOT，
          # 必须删掉让 pub get 用当前 SDK 重新生成，否则 Podfile 里 flutter_root 读错路径。
          rm -f ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh
          rm -f .flutter-plugins .flutter-plugins-dependencies
          flutter pub get
          grep FLUTTER_ROOT ios/Flutter/Generated.xcconfig
          # pub get 升级了依赖，新插件要求更高的 iOS deployment target。
          # 只在 runner 副本上把 12/13 提到 16（不动本地源码）。
          python3 - <<'PY'
          import re
          p = "ios/Podfile"
          s = open(p).read()
          s = re.sub(r"platform :ios, '[\d.]+'", "platform :ios, '16.0'", s)
          # amap_flutter_location 3.0.0 的 podspec 未锁 AMapLocation 版本，
          # 最新版移除了 setReGeocodeLanguage API 会导致编译失败，锁到本地验证过的 2.11.0。
          if "pod 'AMapLocation'" not in s:
              s = s.replace(
                  "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))",
                  "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))\n"
                  "  pod 'AMapLocation', '2.11.0'\n"
                  "  pod 'AMapFoundation', '1.8.2'")
          open(p, "w").write(s)
          p = "ios/Runner.xcodeproj/project.pbxproj"
          s = open(p).read()
          s = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [\d.]+;",
                     "IPHONEOS_DEPLOYMENT_TARGET = 16.0;", s)
          open(p, "w").write(s)
          print("deployment target -> 16.0; AMapLocation pinned to 2.11.0")
          PY
          cd ios
          # 高德 SDK 从 a.amap.com 下载，偶发 Connection reset；重试 3 次。
          for attempt in 1 2 3; do
            echo "=== pod install 尝试 $attempt/3 ==="
            if pod install --repo-update; then
              echo "✅ pod install 成功"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "❌ pod install 连续 3 次失败"
              exit 1
            fi
            echo "⚠️ pod install 失败，10 秒后重试（清掉半成品 Pods）..."
            rm -rf Pods Podfile.lock
            sleep 10
          done

      # ---- 安装签名材料 ----
      - name: Install certificate and provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_AD_HOC }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD_AD_HOC }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_AD_HOC }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }

          [ -n "${IOS_CERTIFICATE:-}" ] || fail "secret IOS_CERTIFICATE_AD_HOC 未配置"
          [ -n "${IOS_PROVISIONING_PROFILE:-}" ] || fail "secret IOS_PROVISIONING_PROFILE_AD_HOC 未配置"

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw -o - "$PROFILE_PLIST")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")
          BUNDLE_ID=${APP_ID#"$TEAM_ID".}
          plutil -extract ProvisionedDevices raw -o /dev/null "$PROFILE_PLIST" \
            || fail "该 profile 不含设备列表，不是 Ad Hoc 类型"
          GTA=$(plutil -extract Entitlements.get-task-allow raw -o - "$PROFILE_PLIST" 2>/dev/null || echo false)
          [ "$GTA" != "true" ] || fail "该 profile 是 Development 类型（get-task-allow=true），不是 Ad Hoc"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "${IOS_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          echo "$IDENTITIES"
          echo "$IDENTITIES" | grep -q "Apple Distribution" \
            || fail "p12 中没有 Apple Distribution 签名身份"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "team=$TEAM_ID profile=$PROFILE_NAME bundle=$BUNDLE_ID"

      # patcher build ios 内部走 `flutter build ipa`，签名必须在 build 之前进工程；
      # 且 patcher 做 SPM 文本解析，pbxproj 只能文本注入（不能 plutil 转 XML）。
      - name: Inject manual signing into pbxproj
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/prepare_ios_signing.py" \
            "$BUNDLE_ID" "$TEAM_ID" "$PROFILE_NAME" "$PWD"

      # ---- 绕过 flutter_patcher 上游 bug（issue #14）----
      # extract-surface 把「命名构造函数与同类实例成员同名」的声明当成实例成员，
      # baseline-kernel 校验时报 `Expected instance member <Class>.<ctor>`。
      # iOS 只能 bytecode 策略，没有 --strategy so 的退路，故直接改名绕过：
      # 在 runner 的 managed SDK + pub-cache + 工程副本上把 ctor 名改为 from<Ctor>，
      # 并同步改写所有调用点（不动用户本地源码）。
      # patcher 的 managed SDK / patched engine / 自带 pub-cache 都缓存在这里，
      # 不缓存的话每次都要重新 clone Flutter SDK（实测 15 分钟以上）。
      - name: Cache flutter_patcher managed environment
        uses: actions/cache@v4
        with:
          path: ~/.flutter_patcher
          key: fp-env-${{ runner.os }}-3.47.9-v2
          restore-keys: |
            fp-env-${{ runner.os }}-3.47.9-

      - name: Warm managed SDK
        working-directory: ${{ inputs.project_path }}
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/patcher-warm"
          # 首次会 clone managed Flutter SDK；本工程在 baseline-kernel 阶段失败是预期的
          # （那里正是要修的上游 bug），这里只取 SDK。
          dart run flutter_patcher build ios \
            --application-id "$BUNDLE_ID" --version-code "$VERSION_CODE" \
            --export-method ad-hoc --out "$GITHUB_WORKSPACE/patcher-warm" \
            > /dev/null 2>&1 || true
          rm -rf "$HOME"/.flutter_patcher/builds/run.pending-* "$GITHUB_WORKSPACE/patcher-warm"
          SDK_DIR=$(find "$HOME/.flutter_patcher/flutter" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1 || true)
          [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/packages/flutter" ] \
            || { echo "::error::managed SDK 未就绪（$HOME/.flutter_patcher/flutter）"; exit 1; }
          echo "MANAGED_SDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "managed SDK: $SDK_DIR"

      - name: Normalize named constructors (upstream bug workaround)
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/normalize_named_ctors.py" \
            --project "$PWD" --sdk "$MANAGED_SDK" \
            --pub-cache "$HOME/.flutter_patcher/pub-cache" \
            --report "$RUNNER_TEMP/ctors.json"
          echo "=== 冲突明细（最多 60 行）==="
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/ctors.json'));print(len(d['collisions']),'处冲突');[print(' ',c['class']+'.'+c['ctor'],'->',c['new']) for c in d['collisions']]"

      # 先用 managed SDK 自己编译一次 kernel：这一步失败 → 是源码/改名的问题；
      # 通过而 patcher 仍失败 → 是 patcher pipeline 的问题。省得盲猜。
      - name: Smoke compile with managed SDK
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          echo "=== managed SDK: $MANAGED_SDK ==="
          "$MANAGED_SDK/bin/flutter" --version 2>&1 | head -3
          echo "=== 编译冒烟（release kernel）==="
          "$MANAGED_SDK/bin/flutter" --suppress-analytics build bundle \
            --release --target lib/main.dart --no-pub 2>&1 | tail -40
          rm -rf build/flutter_assets

      - name: Build patcher host IPA (hot-update capable)
        working-directory: ${{ inputs.project_path }}
        env:
          BUILD_ID: ${{ inputs.build_id }}
          VERSION_CODE: ${{ inputs.version_code }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          echo "=== flutter_patcher 版本 ==="
          dart run flutter_patcher --version 2>&1 | head -3 || true

          # patcher 会解锁/使用 keychain 里的 Apple Distribution 身份签名
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH" || true

          OUT="$GITHUB_WORKSPACE/patcher-out/$BUILD_ID"
          rm -rf "$OUT"
          mkdir -p "$(dirname "$OUT")"
          set +e
          dart run flutter_patcher build ios \
            --application-id "$BUNDLE_ID" \
            --version-code "$VERSION_CODE" \
            --export-method ad-hoc \
            --out "$OUT" \
            2> "$RUNNER_TEMP/patcher.err" | tee "$RUNNER_TEMP/patcher.json"
          code=${PIPESTATUS[0]}
          set -e
          if [ -s "$RUNNER_TEMP/patcher.err" ]; then
            echo "----- patcher stderr tail -----"
            fold -w 300 "$RUNNER_TEMP/patcher.err" | tail -60
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::patcher build 失败 (exit=$code)"
            echo "----- patcher stderr 全量 -----"
            fold -w 300 "$RUNNER_TEMP/patcher.err" 2>/dev/null || true
            echo "----- evidence 目录 -----"
            for d in "$HOME"/.flutter_patcher/builds/run.pending-*; do
              [ -d "$d" ] || continue
              echo "== $d =="
              find "$d" -maxdepth 1 -type f | head -20
              for f in failure.json log.txt build.log steps.json; do
                if [ -f "$d/$f" ]; then
                  echo "--- $f ---"
                  tail -100 "$d/$f"
                fi
              done
            done
            exit "$code"
          fi

          echo "=== patcher build.json ==="
          cat "$RUNNER_TEMP/patcher.json"
          IPA=$(find "$OUT" -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::patcher 未产出 IPA"; find "$OUT" -type f | head -30; exit 1; }
          cp "$IPA" "build/${BUILD_ID}.ipa"
          echo "✅ IPA: build/${BUILD_ID}.ipa"
          ls -lh "build/${BUILD_ID}.ipa"

          # 校验 host trust 注入成功（patcher 会写 FlutterPatcherHostTrust 到 Info.plist）
          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
          unzip -q "build/${BUILD_ID}.ipa" -d /tmp/ipa_check
          echo "--- Info.plist 关键字段 ---"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion FlutterPatcherHostTrust; do
            printf '%s = ' "$key"
            plutil -extract "$key" raw -o - /tmp/ipa_check/Payload/Runner.app/Info.plist 2>/dev/null | head -c 300 || echo "(缺失)"
            echo ""
          done
          echo "--- 内嵌 engine（应为 patched engine）---"
          ls -lh /tmp/ipa_check/Payload/Runner.app/Frameworks/Flutter.framework/Flutter

      # 基线是后续生成补丁的唯一依据：丢了对应构建就再也打不了补丁，必须持久化。
      - name: Pack baseline
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          BASELINE_DIR=".flutter_patcher/baselines"
          if [ -d "$BASELINE_DIR" ]; then
            ls -lh "$BASELINE_DIR"
            tar -czf "$RUNNER_TEMP/ios-baseline-${{ inputs.version_code }}.tar.gz" -C "$BASELINE_DIR" .
            ls -lh "$RUNNER_TEMP/ios-baseline-${{ inputs.version_code }}.tar.gz"
          else
            echo "::warning::未找到基线目录 $BASELINE_DIR"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-patcher
          path: ${{ inputs.project_path }}/build/${{ inputs.build_id }}.ipa
          retention-days: 14

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-baseline
          path: ${{ runner.temp }}/ios-baseline-${{ inputs.version_code }}.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Attach IPA and baseline to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          PROJECT: ${{ inputs.project_path }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -e
          IPA="$PROJECT/build/${BUILD_ID}.ipa"
          BASELINE="$RUNNER_TEMP/ios-baseline-${VERSION_CODE}.tar.gz"
          ASSETS=("$IPA#zmoa-patcher-${BUILD_ID}.ipa")
          [ -f "$BASELINE" ] && ASSETS+=("$BASELINE#ios-baseline-${VERSION_CODE}.tar.gz")
          for attempt in 1 2 3; do
            if gh release upload ios-patcher-latest "${ASSETS[@]}" -R "$GITHUB_REPOSITORY" --clobber 2>/dev/null; then
              echo "✅ 已上传到 release ios-patcher-latest"; exit 0
            fi
            echo "上传失败（$attempt/3），10s 后重试"; sleep 10
          done
          echo "release 不存在或上传失败，创建中..."
          gh release create ios-patcher-latest "${ASSETS[@]}" \
            -R "$GITHUB_REPOSITORY" --title "iOS Patcher Host IPA (hot-update)" \
            --notes "支持热更新的 patcher 宿主包（含基线）"

      - name: Cleanup keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ] && \
            security delete-keychain "$KEYCHAIN_PATH" || true
