name: flutter_patcher_example
description: "Demonstrates flutter_patcher: build a host, patch it and serve the patch."
publish_to: 'none'
# The build number is the host's versionCode; each host needs a new one.
version: 1.0.0+1

environment:
  # The floor of flutter_patcher itself: older SDKs stop at pub get.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_patcher:
    # This repository's plugin; an app depends on flutter_patcher: 1.1.1.
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# archive reaches the app through flutter_patcher, so it lives in the host and
# a patch cannot change it. A newer release on the package host would make
# `patch` fail with PATCH_PINNED_PACKAGE_CHANGED; this keeps the version the
# host was built with. Bump it together with the next host build.
dependency_overrides:
  archive: 4.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/patch_demo.png